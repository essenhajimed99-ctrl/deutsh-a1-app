name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Project and Web Assets
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          mkdir -p www
          # نسخ جميع ملفات المشروع الحالية إلى مجلد www لضمان عمل الجافا سكريبت
          cp -r * www/ 2>/dev/null || true
          rm -rf www/android www/.github www/www
          
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor & Sync
        run: |
          npx cap init "Deutsch A1" "com.deutsch.a1" --web-dir "www" || true
          npx cap add android || true
          npx cap sync android

      - name: Fix Kotlin Conflict & Build Debug APK
        run: |
          cd android
          echo "" >> build.gradle
          echo "configurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24' }" >> build.gradle
          
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-a1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
