name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create Project Structure Safely
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          mkdir -p www
          if [ ! -f "www/index.html" ] && [ ! -f "index.html" ]; then
            echo "<html><body><h1>Deutsch A1 Pop-up Book</h1></body></html>" > www/index.html
          elif [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor & Add Android
        run: |
          npx cap init "Deutsch A1" "com.deutsch.a1" --web-dir "www" || true
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-a1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
