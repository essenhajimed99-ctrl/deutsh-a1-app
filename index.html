function popBox(label,x,z,w=1,h=1,d=.7,color='#f0e5cd',id=label){const group=new THREE.Group();group.position.set(x,.22,z);const base=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),gold);base.position.y=.04;group.add(base);const obj=new THREE.Mesh(new THREE.BoxGeometry(w*.82,h,d*.72),mat(color));obj.position.y=.12+h/2;obj.castShadow=true;obj.userData={id,baseY:obj.position.y};group.add(obj);const edges=new THREE.LineSegments(new THREE.EdgesGeometry(obj.geometry),new THREE.LineBasicMaterial({color:'#28231d',linewidth:1.5}));edges.position.copy(obj.position);group.add(edges);addLabel(label,x,.235,z+d*.55,.16);group.userData={id,obj,baseY:obj.position.y,active:false};diagram.add(group);return group}
function buildScene(l){clearDiagram();const n=l.objects.length; l.objects.forEach((o,i)=>{let x=-1.6+(i%3)*1.6,z=-1.3+Math.floor(i/3)*1.5;const p=popBox(o,x,z,1.05,.45+(i%3)*.2,.75,i%2?'#e8ddc7':'#eee3cd',o);p.userData.id=o;});}
function updateUI(){const l=lessons[current];document.querySelector('#module').textContent=`MODULE ${String(current+1).padStart(2,'0')} / 09`;document.querySelector('#title').textContent=l.title;document.querySelector('#summary').innerHTML=l.summary.map(s=>`<p>${s}</p>`).join('');document.querySelector('#principle').textContent=l.principle;document.querySelector('#vocab').innerHTML=l.vocabulary.map(v=>`<div><b>${v[0]} <button type="button" class="speak-word" data-word="${v[0]}" aria-label="Aussprache">🔊</button></b>${v[1]}</div>`).join('');document.querySelectorAll('.speak-word').forEach(btn=>btn.addEventListener('click',()=>speakGerman(btn.dataset.word)));restoreProgress();document.querySelector('#question').textContent=l.question;document.querySelector('#options').innerHTML='';l.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>answer(i,b);document.querySelector('#options').appendChild(b)});document.querySelector('#why').style.display='none';document.querySelector('#why').textContent=l.why;document.querySelector('#stamp').innerHTML='○<br>NOT YET';document.querySelector('#stamp').style.color='#a38d68';document.querySelector('#lessonName').textContent=l.module;buildScene(l);if(interactions.size>=l.objects.length+1){document.querySelector('#stamp').innerHTML='✦<br>COMPLETED';document.querySelector('#stamp').style.color='#62825b';}document.querySelector('#toc').classList.remove('open');}
function answer(i,b){const l=lessons[current];[...document.querySelectorAll('.opts button')].forEach(x=>x.disabled=true);if(i===l.correct){b.classList.add('correct');document.querySelector('#why').style.display='block';interactions.add('quiz');saveProgress();checkStamp()}else{b.classList.add('wrong');document.querySelector('#why').style.display='block';document.querySelector('#why').textContent='حاول مرة أخرى. '+l.why;setTimeout(()=>{[...document.querySelectorAll('.opts button')].forEach(x=>{x.disabled=false;x.classList.remove('wrong')});document.querySelector('#why').style.display='none'},1800)}}
function checkStamp(){if(interactions.size>=lessons[current].objects.length+1){document.querySelector('#stamp').innerHTML='✦<br>COMPLETED';document.querySelector('#stamp').style.color='#62825b'}}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(diagram.children,true);if(hits.length){let o=hits[0].object;while(o.parent&&o.parent!==diagram)o=o.parent;if(o.userData.id){activate(o);}}});
function activate(g){const id=g.userData.id;interactions.add(id);saveProgress();g.userData.active=!g.userData.active;g.children.forEach((o,i)=>{if(o.isMesh&&o.geometry.type==='BoxGeometry'&&i>0){o.material=mat(g.userData.active?'#e6bd55':'#eee3cd');o.position.y=g.userData.active?g.userData.baseY+.55:g.userData.baseY}});checkStamp()}
function go(i){current=(i+lessons.length)%lessons.length;updateUI();if(!reduced){book.rotation.y=.06;setTimeout(()=>book.rotation.y=0,350)}}
document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);
document.querySelector('#tocBtn').onclick=()=>{const t=document.querySelector('#toc');t.classList.toggle('open');if(t.childElementCount===0)lessons.forEach((l,i)=>{const d=document.createElement('div');d.className='tocitem';d.innerHTML=`<span>${String(i+1).padStart(2,'0')} · ${l.module}</span><span>↗</span>`;d.onclick=()=>go(i);t.appendChild(d)})};
document.querySelector('#reset').onclick=()=>{if(reduced){camera.position.set(0,7.6,9.6);controls.target.set(0,0,0)}else{camera.position.lerp(new THREE.Vector3(0,7.6,9.6),.7);controls.target.lerp(new THREE.Vector3(0,0,0),.7)}};
document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.querySelector('#motion').style.opacity=reduced?'.45':'1'};
document.querySelector('#contrast').onclick=()=>{high=!high;document.body.style.filter=high?'contrast(1.2)':'none'};
document.querySelector('#soundBtn').onclick=()=>{const l=lessons[current];speakGerman(l.vocabulary.map(v=>v[0]).join('. '));};
function watch(){if(demo){demo=false;clearInterval(demoTimer);document.querySelector('#demoCaption').style.display='none';controls.enabled=true;document.querySelector('#play').textContent='▶';return}demo=true;controls.enabled=false;document.querySelector('#play').textContent='Ⅱ';const cap=document.querySelector('#demoCaption');cap.style.display='block';let step=0;const msgs=['شوف العناصر البارزة فوق الصفحة اليمنى.','اضغط على كل نموذج باش تشوف التفاعل.','جاوب على سؤال التوقع في الصفحة اليسرى.'];const run=()=>{if(!demo)return;cap.textContent=msgs[step%msgs.length];const target=[new THREE.Vector3(0,7.6,9.6),new THREE.Vector3(3.2,5.3,6.4),new THREE.Vector3(-2.4,6.4,7.5)][step%3];camera.position.lerp(target,.8);step++;if(step>5){demo=false;controls.enabled=true;cap.style.display='none';document.querySelector('#play').textContent='▶';clearInterval(demoTimer)}};run();demoTimer=setInterval(run,1900)}
document.querySelector('#play').onclick=watch;
renderer.domElement.addEventListener('pointerdown',()=>{if(demo){demo=false;clearInterval(demoTimer);controls.enabled=true;document.querySelector('#demoCaption').style.display='none';document.querySelector('#play').textContent='▶'}});
updateUI();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
